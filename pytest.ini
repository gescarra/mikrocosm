# =====================================================================
#  Two suites, and only one of them runs by default.
#
#    pytest                     the UNIT suite. Hermetic: no keystore, no
#                               network, no hardware. Gates every merge.
#
#    pytest tests/functional    the FUNCTIONAL gate. Talks to live routers over
#                               SSH and needs out/manifest.json. This is what
#                               the pipeline runs after each router is
#                               deployed, and what stops the rollout.
#
#  `testpaths` deliberately excludes tests/functional. A bare `pytest` that
#  tried to SSH to four routers (and failed on a laptop, or worse, on a
#  developer machine that CAN reach them) isn't a default anybody wants.
#
#  See docs/netdevops.md.
# =====================================================================
[pytest]
testpaths = tests/unit
# rootdir on sys.path, so `from tests.functional.routeros import ...` resolves
# the same way from the repo root and from a CI job's checkout.
pythonpath = .
addopts = --strict-markers -ra
filterwarnings =
    error::DeprecationWarning
