# Local config for the AS64500 router rollout.
# Everything runs from the control node (connection: local) which drives ssh/scp
# itself, so RouterOS never sees a persistent Ansible session that a reset could kill.
[defaults]
# GENERATED, not committed: generate.py writes it from topology.yml on every
# ./build.sh. The fleet is described in exactly one place, and adding a router
# no longer means remembering to edit an inventory as well.
#
# "inventory not found" here means the build has not run. That is the right
# error: there is nothing to deploy either.
inventory            = ../out/inventory.yml
host_key_checking    = False
retry_files_enabled  = False
deprecation_warnings = False
forks                = 1

[callback_default]
# Readable YAML-formatted task output (replaces the removed yaml stdout callback).
result_format = yaml
