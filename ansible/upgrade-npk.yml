# =====================================================================
#  upgrade-npk.yml. Push a SPECIFIC RouterOS version onto every router,
#  one at a time: download the .npk on the control node, scp it to the
#  router's root, reboot, wait for it to come back, verify the version,
#  next router.
#
#  How this differs from upgrade.yml: that playbook asks each router to
#  fetch "latest on its channel" from upgrade.mikrotik.com itself. This one
#  pins the version YOU name and does the fetching from the control node, so
#    - every router lands on exactly the same build, and
#    - the routers need no DNS or outbound HTTPS to MikroTik at all.
#
#  MikroTik has no "latest" URL (downloads are keyed by version) so you
#  pass either the version or the full link (exactly one of them):
#
#    ansible-playbook upgrade-npk.yml -e ros_version=7.24.5
#    ansible-playbook upgrade-npk.yml -e npk_url=https://download.mikrotik.com/routeros/7.24.5/routeros-7.24.5.npk
#
#  With ros_version the file name is built per router from its architecture
#  (x86_64 CHR -> routeros-7.24.5.npk, anything else -> routeros-7.24.5-<arch>.npk),
#  so a mixed fleet just works. With npk_url the file must match the router's
#  architecture or the run stops before anything is uploaded.
#
#  Nothing here touches the config. No reset, no .rsc. Same as upgrade.yml,
#  the config, files (including deploy.yml's <fqdn>.applied) and licence
#  survive the package install.
#
#  ORDER: br1 -> er1 -> br2 -> er2, serial:1 + order:inventory, for the same
#  reason as deploy.yml. One BR and one ER stay up at every step. The next
#  router isn't touched until the previous one is back on the new version AND
#  its BGP/OSPF are back to where they were before the reboot.
#
#  Usage:
#    ansible-playbook upgrade-npk.yml -e ros_version=7.24.5 --check   # report only
#    ansible-playbook upgrade-npk.yml -e ros_version=7.24.5           # gate before each
#    ansible-playbook upgrade-npk.yml -e ros_version=7.24.5 -e gate=auto   # no prompts
#    ansible-playbook upgrade-npk.yml -e ros_version=7.24.5 --limit br1.ord1
#    ansible-playbook upgrade-npk.yml -e ros_version=7.24.5 -e skip=er1.hdc
# =====================================================================
- name: Push a pinned RouterOS .npk, one router at a time
  hosts: routers
  gather_facts: false
  connection: local
  serial: 1            # one router at a time
  order: inventory     # keep the deliberate br1 -> er1 -> br2 -> er2 order
  any_errors_fatal: true

  vars:
    ros_version: ""           # -e ros_version=7.24.5
    npk_url: ""               # -e npk_url=https://download.mikrotik.com/routeros/7.24.5/routeros-7.24.5.npk
    npk_base_url: https://download.mikrotik.com/routeros

    skip: ""                  # -e skip=a,b  -> leave these routers alone
    skip_list: "{{ (skip | string).split(',') | map('trim') | reject('equalto', '') | list }}"

    # Same guard as upgrade.yml, same reason: the ebgp-out chains in
    # br.rsc.j2 are written against the ROS7 filter language, and a box that
    # comes back on a new major with silently dead filters looks healthy.
    allow_major: false

    # Headroom on top of the package itself. RouterOS unpacks during the
    # install reboot, so a disk that only just fits the .npk isn't enough.
    free_margin_bytes: 10000000

    npk_dir: "{{ out_dir }}/npk"     # local cache; out/ is gitignored

    # routeros-<ver>.npk or routeros-<ver>-<arch>.npk. Group 1 is the version.
    npk_name_re: '^routeros-([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:(?:beta|rc)[0-9]+)?)(?:-[a-z0-9]+)?\.npk$'

    target_version: >-
      {{ ros_version | string | trim if (ros_version | string | trim) | length > 0
         else (npk_url | basename | regex_replace(npk_name_re, '\1')
               if (npk_url | basename) is regex(npk_name_re) else '') }}

    ssh_base: "{{ ['ssh', '-p', ssh_port | string] + ros_ssh_opts + [router_user ~ '@' ~ router_address] }}"

    # BGP established, OSPF Full. The "back online" bar is relative to what
    # the router had before the reboot, never a hardcoded count. A session
    # that was already down must not be blamed on the upgrade.
    health_cmd: >-
      :put ([:tostr [:len [/routing/bgp/session find where established]]] . ","
      . [:tostr [:len [/routing/ospf/neighbor find where state="Full"]]])

    # Every .npk in /file. RouterOS installs EVERY package in the root on
    # reboot, so a stale one from an old attempt would ride along with ours.
    list_npk_cmd: >-
      :foreach f in=[/file find] do={ :local n [/file get $f name];
      :if ([:len $n] > 4) do={ :if ([:pick $n ([:len $n] - 4) [:len $n]] = ".npk") do={ :put $n } } }

    list_pkg_cmd: >-
      :foreach p in=[/system/package find] do={ :put [/system/package get $p name] }

  tasks:
    # ---- INPUT -------------------------------------------------------
    - name: "Input | exactly one of ros_version / npk_url, and it names a version"
      ansible.builtin.assert:
        that:
          - (ros_version | string | trim | length > 0) != (npk_url | string | trim | length > 0)
          - target_version | length > 0
          - target_version is regex('^[0-9]+[.][0-9]+([.][0-9]+)?((beta|rc)[0-9]+)?$')
        fail_msg: >-
          Pass exactly one of -e ros_version=7.24.5 or
          -e npk_url=https://download.mikrotik.com/routeros/7.24.5/routeros-7.24.5.npk
          (got ros_version='{{ ros_version }}', npk_url='{{ npk_url }}',
          parsed version '{{ target_version }}').
        quiet: true

    # ---- MANUAL SKIP -------------------------------------------------
    - name: "Skip | router named in 'skip' var — do nothing"
      ansible.builtin.debug:
        msg: "SKIP {{ inventory_hostname }} — excluded by skip='{{ skip }}'."
      when: inventory_hostname in skip_list

    - name: "Skip | end play for manually-skipped router"
      ansible.builtin.meta: end_host
      when: inventory_hostname in skip_list

    # ---- PREFLIGHT ---------------------------------------------------
    # NO HOST VARIABLES IN `name:`. See the note in deploy.yml. Identity goes
    # in `msg:`/`prompt:`.
    - name: "Preflight | router answers SSH right now"
      ansible.builtin.wait_for:
        host: "{{ router_address }}"
        port: "{{ ssh_port }}"
        state: started
        timeout: 15
      # Times out? SSH is source-filtered to mgmt_prefixes. Run from the home site.

    - name: "Preflight | identity, version, architecture, free space"
      ansible.builtin.command:
        argv: "{{ ssh_base + [':put ([/system/identity/get name] . \",\" . [/system/package/update/get installed-version] . \",\" . [/system/resource/get architecture-name] . \",\" . [:tostr [/system/resource/get free-hdd-space]])'] }}"
      register: pre_facts
      changed_when: false
      check_mode: false
      retries: 3
      delay: 5
      until: pre_facts.rc == 0

    - name: "Preflight | name the facts"
      ansible.builtin.set_fact:
        ros_identity: "{{ (pre_facts.stdout | trim | split(','))[0] | trim }}"
        ros_installed: "{{ (pre_facts.stdout | trim | split(','))[1] | trim }}"
        ros_arch: "{{ (pre_facts.stdout | trim | split(','))[2] | trim }}"
        ros_free: "{{ (pre_facts.stdout | trim | split(','))[3] | trim | int }}"

    - name: "Preflight | we are talking to the router we think we are"
      ansible.builtin.assert:
        that: ros_identity == inventory_hostname
        fail_msg: >-
          {{ router_address }} identifies as '{{ ros_identity }}', not
          '{{ inventory_hostname }}'. Fix the inventory before upgrading anything.
        success_msg: "{{ inventory_hostname }}: RouterOS {{ ros_installed }} on {{ ros_arch }}"

    # Only the main `routeros` package is being pushed. Any extra package
    # (container, wireless, ...) would be left on the old version and refused
    # at boot, so stop here rather than discover it after the reboot.
    - name: "Preflight | installed packages"
      ansible.builtin.command:
        argv: "{{ ssh_base + [list_pkg_cmd] }}"
      register: pkgs
      changed_when: false
      check_mode: false

    - name: "Preflight | only the routeros package is installed"
      ansible.builtin.assert:
        that: (pkgs.stdout_lines | map('trim') | reject('equalto', '') | reject('equalto', 'routeros') | list) | length == 0
        fail_msg: >-
          {{ inventory_hostname }} has extra packages installed:
          {{ pkgs.stdout_lines | map('trim') | reject('equalto', '') | reject('equalto', 'routeros') | join(', ') }}.
          This playbook only pushes routeros-{{ target_version }}.npk, which would leave
          those on the old version. Use upgrade.yml for this router, or uninstall them.
        quiet: true

    # ---- WHAT TO FETCH -----------------------------------------------
    - name: "Package | file name and URL for this router's architecture"
      ansible.builtin.set_fact:
        npk_name: "routeros-{{ target_version }}{{ '' if ros_arch == 'x86_64' else '-' ~ ros_arch }}.npk"
        npk_src: >-
          {{ npk_url | trim if (npk_url | string | trim) | length > 0
             else npk_base_url ~ '/' ~ target_version ~ '/routeros-' ~ target_version
                  ~ ('' if ros_arch == 'x86_64' else '-' ~ ros_arch) ~ '.npk' }}

    - name: "Package | the URL is for this router's architecture"
      ansible.builtin.assert:
        that: npk_src | basename == npk_name
        fail_msg: >-
          {{ inventory_hostname }} is {{ ros_arch }} and needs {{ npk_name }}, but npk_url
          points at {{ npk_src | basename }}. RouterOS would ignore a wrong-arch package
          and reboot on {{ ros_installed }}. Pass -e ros_version={{ target_version }}
          instead and the right file is picked per router.
        quiet: true

    # A HEAD, so --check also proves the version exists before anyone commits
    # to a rollout, and the size is known before anything is downloaded.
    - name: "Package | it exists on MikroTik's server"
      ansible.builtin.uri:
        url: "{{ npk_src }}"
        method: HEAD
        follow_redirects: safe
      register: npk_head
      check_mode: false
      failed_when: npk_head.status != 200
      # 404? The version string is wrong or not released for this arch yet.

    - name: "Package | remember the size"
      ansible.builtin.set_fact:
        npk_size: "{{ npk_head.content_length | int }}"

    # ---- DECIDE ------------------------------------------------------
    - name: "Decide | is there anything to do"
      ansible.builtin.set_fact:
        ros_needed: "{{ ros_installed is version(target_version, '<') }}"

    - name: "Decide | already newer — an .npk upload cannot downgrade"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs {{ ros_installed }}, newer than {{ target_version }}.
          Uploading an older .npk and rebooting does nothing (a downgrade needs
          /system/package/downgrade). Leaving it alone.
      when: ros_installed is version(target_version, '>')

    - name: "Decide | status"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ('UPGRADE ' ~ ros_installed ~ ' -> ' ~ target_version
                                        ~ ' via ' ~ npk_name ~ ' (' ~ ((npk_size | int / 1048576) | round(1)) ~ ' MiB)')
                                       if ros_needed | bool else 'nothing to do (' ~ ros_installed ~ ')' }}

    - name: "Decide | nothing to do — leave this router alone (no reboot)"
      ansible.builtin.meta: end_host
      when: not (ros_needed | bool)

    - name: "Decide | refuse a major-version jump unless explicitly allowed"
      ansible.builtin.assert:
        that: (ros_installed.split('.')[0] | int) == (target_version.split('.')[0] | int) or (allow_major | bool)
        fail_msg: >-
          {{ inventory_hostname }}: {{ ros_installed }} -> {{ target_version }} crosses a MAJOR
          version. The routing filters in br.rsc.j2 are written against the ROS7 rule
          language and can come back silently broken. Read the release notes, test on ONE
          border router, then re-run with -e allow_major=true.
        quiet: true

    # ---- ROUTER-SIDE PRECONDITIONS ------------------------------------
    - name: "Preflight | any .npk already sitting on the router"
      ansible.builtin.command:
        argv: "{{ ssh_base + [list_npk_cmd] }}"
      register: npk_on_router
      changed_when: false
      check_mode: false

    # Our own file is fine (a re-run after an aborted upload overwrites it).
    # Anything else in the root would be installed alongside it on reboot.
    - name: "Preflight | no stale .npk in the root"
      ansible.builtin.assert:
        that: stale_npks | length == 0
        fail_msg: >-
          {{ inventory_hostname }} already has {{ stale_npks | join(', ') }} in its root.
          RouterOS installs EVERY .npk there on reboot. Remove them first:
          /file remove [find name="{{ (stale_npks + [npk_name])[0] }}"]
        quiet: true
      vars:
        stale_npks: >-
          {{ npk_on_router.stdout_lines | map('trim') | reject('equalto', '')
             | reject('search', '/') | reject('equalto', npk_name) | list }}

    - name: "Preflight | enough free space for the package"
      ansible.builtin.assert:
        that: ros_free | int > npk_size | int + free_margin_bytes | int
        fail_msg: >-
          {{ inventory_hostname }} has {{ (ros_free | int / 1048576) | round(1) }} MiB free;
          the package needs {{ (npk_size | int / 1048576) | round(1) }} MiB plus headroom.
          Clear old backups/exports from /file first.
        quiet: true

    - name: "Check mode | report only, change nothing"
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    # ---- DOWNLOAD (control node) -------------------------------------
    # Cached in out/npk/: the second router of the same arch reuses it.
    # get_url writes to a temp file and renames, so an interrupted download
    # never leaves a truncated .npk to be mistaken for a good one.
    - name: "Download | local cache directory"
      ansible.builtin.file:
        path: "{{ npk_dir }}"
        state: directory
        mode: "0755"

    - name: "Download | fetch the .npk to the control node"
      ansible.builtin.get_url:
        url: "{{ npk_src }}"
        dest: "{{ npk_dir }}/{{ npk_name }}"
        mode: "0644"
        timeout: 120

    - name: "Download | local file size"
      ansible.builtin.stat:
        path: "{{ npk_dir }}/{{ npk_name }}"
        get_checksum: false
      register: npk_local

    # MikroTik doesn't publish a checksum file next to the .npk. Size is the
    # transport check; the package signature, which RouterOS verifies itself
    # before installing, is the integrity check.
    - name: "Download | complete"
      ansible.builtin.assert:
        that: npk_local.stat.size | int == npk_size | int
        fail_msg: >-
          {{ npk_dir }}/{{ npk_name }} is {{ npk_local.stat.size }} bytes, the server says
          {{ npk_size }}. Delete it and re-run.
        quiet: true

    # ---- GATE --------------------------------------------------------
    - name: "Health | snapshot before the reboot"
      ansible.builtin.command:
        argv: "{{ ssh_base + [health_cmd] }}"
      register: pre_health
      changed_when: false

    - name: "Health | parse"
      ansible.builtin.set_fact:
        h0: "{{ pre_health.stdout | trim | split(',') | map('trim') | map('int') | list }}"

    - name: "GATE | automatic"
      ansible.builtin.debug:
        msg: >-
          UPGRADE {{ inventory_hostname }} ({{ router_address }}) {{ ros_installed }} ->
          {{ target_version }}. Unattended (gate=auto).
          Before: BGP {{ h0[0] }} established, OSPF {{ h0[1] }} Full.
      when: gate == "auto"

    - name: "GATE | confirm before upgrading this router"
      when: gate != "auto"
      ansible.builtin.pause:
        prompt: |

          ============================================================
           UPGRADE  {{ inventory_hostname }}  ({{ router_address }})
          ============================================================
            RouterOS : {{ ros_installed }} -> {{ target_version }}
            Package  : {{ npk_name }}  ({{ (npk_size | int / 1048576) | round(1) }} MiB, {{ ros_arch }})
            Health   : BGP {{ h0[0] }} established, OSPF {{ h0[1] }} Full

          Uploads the package to the router's root, then REBOOTS it.
          Every session on this box drops until it is back.

          Config is not touched — a failed install leaves the box on
          {{ ros_installed }}, not unconfigured. Console open anyway.

          ENTER = proceed   |   Ctrl-C then A = abort the whole rollout
          ============================================================

    # ---- UPLOAD ------------------------------------------------------
    - name: "Upload | scp the .npk to the router's root"
      ansible.builtin.command:
        argv: "{{ ['scp', '-O', '-P', ssh_port | string] + ros_ssh_opts + [npk_dir ~ '/' ~ npk_name, router_user ~ '@' ~ router_address ~ ':' ~ npk_name] }}"
      changed_when: true

    - name: "Upload | it landed whole"
      ansible.builtin.command:
        argv: "{{ ssh_base + [':put [:tostr [/file/get [find name=\"' ~ npk_name ~ '\"] size]]'] }}"
      register: npk_remote
      changed_when: false
      retries: 3
      delay: 5
      until: npk_remote.rc == 0 and (npk_remote.stdout | trim | int) == (npk_size | int)
      # Still short after retries? NOTHING has rebooted. The router is in
      # service on its old version. Remove the partial file before re-running.

    # ---- REBOOT ------------------------------------------------------
    - name: "Reboot | install the package (link drops here)"
      ansible.builtin.command:
        argv: "{{ ssh_base + ['/system/reboot'] }}"
      changed_when: true
      failed_when: false
      # The session dies with the box, so a non-zero rc is EXPECTED.

    # Any router that got this far has rebooted onto a new package, and
    # RouterOS resets SNMPv3 engineBoots when it does. zabbix-snmp-reload.yml
    # (imported at the end) keys off this to flush Zabbix's engine cache.
    - name: "Reboot | flag the SNMPv3 engine reset for Zabbix"
      ansible.builtin.set_fact:
        npk_installed: true

    - name: "Reboot | SSH goes DOWN (the reboot actually started)"
      ansible.builtin.wait_for:
        host: "{{ router_address }}"
        port: "{{ ssh_port }}"
        state: stopped
        timeout: "{{ down_timeout }}"

    - name: "Reboot | SSH comes BACK"
      ansible.builtin.wait_for:
        host: "{{ router_address }}"
        port: "{{ ssh_port }}"
        state: started
        delay: 15
        timeout: "{{ up_timeout }}"

    - name: "Verify | read version + identity back (retries while SSH settles)"
      ansible.builtin.command:
        argv: "{{ ssh_base + [':put ([/system/package/update/get installed-version] . \"|\" . [/system/identity/get name])'] }}"
      register: post_ver
      changed_when: false
      retries: 12
      delay: 10
      until: post_ver.rc == 0

    - name: "Verify | the upgrade took"
      ansible.builtin.assert:
        that:
          - (post_ver.stdout | trim | split('|') | first | trim) == target_version
          - (post_ver.stdout | trim | split('|') | last | trim) == inventory_hostname
        fail_msg: >-
          {{ inventory_hostname }} came back as '{{ post_ver.stdout | trim }}' — expected
          {{ target_version }}|{{ inventory_hostname }}. The package was not installed;
          RouterOS logs why at boot: /log print where message~"install" . If
          {{ npk_name }} is still in /file, it was refused rather than consumed.
        success_msg: "{{ inventory_hostname }} is now on RouterOS {{ target_version }}."

    # ---- BACK IN SERVICE ---------------------------------------------
    # SSH answering isn't the same as routing. Wait for BGP and OSPF to get
    # back to where they were before moving on, or the next reboot can take
    # down the other half of a pair that hasn't actually recovered.
    - name: "Health | wait for BGP + OSPF to come back to where they were"
      ansible.builtin.command:
        argv: "{{ ssh_base + [health_cmd] }}"
      register: post_health
      changed_when: false
      retries: "{{ converge_retries }}"
      delay: "{{ converge_delay }}"
      until: >-
        post_health.rc == 0
        and (post_health.stdout | trim | split(',') | map('trim') | map('int') | list)[0] >= h0[0] | int
        and (post_health.stdout | trim | split(',') | map('trim') | map('int') | list)[1] >= h0[1] | int
      failed_when: false

    # Padded so a router that never answered fails the assert below with a
    # readable message rather than an index error.
    - name: "Health | parse the post-reboot snapshot"
      ansible.builtin.set_fact:
        h1: "{{ ((post_health.stdout | default('') | trim | split(',') | map('trim') | map('int') | list) + [0, 0])[:2] }}"

    - name: "Health | the router is no worse off than before"
      ansible.builtin.assert:
        that:
          - h1[0] | int >= h0[0] | int      # BGP sessions established
          - h1[1] | int >= h0[1] | int      # OSPF neighbours Full
        fail_msg: >-
          {{ inventory_hostname }} is on {{ target_version }} but did NOT reconverge:
          BGP {{ h1[0] }} vs {{ h0[0] }} before, OSPF Full {{ h1[1] }} vs {{ h0[1] }}.
          STOP before the next router. On this one:
          /routing/bgp/session print ; /routing/ospf/neighbor print ; /log print
        success_msg: >-
          {{ inventory_hostname }}: RouterOS {{ target_version }}, BGP {{ h1[0] }} established,
          OSPF {{ h1[1] }} Full — back in service.

# =====================================================================
#  Final summary across the whole inventory, skipped routers included.
# =====================================================================
- name: Fleet version summary
  hosts: routers
  gather_facts: false
  connection: local
  any_errors_fatal: false

  vars:
    ssh_base: "{{ ['ssh', '-p', ssh_port | string] + ros_ssh_opts + [router_user ~ '@' ~ router_address] }}"

  tasks:
    - name: "Summary | read the running version"
      ansible.builtin.command:
        argv: "{{ ssh_base + [':put [/system/package/update/get installed-version]'] }}"
      register: final_ver
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "Summary"
      ansible.builtin.debug:
        msg: >-
          {{ '%-12s' | format(inventory_hostname) }}
          {{ ('RouterOS ' ~ (final_ver.stdout | trim)) if final_ver.rc == 0 else 'UNREACHABLE' }}

# =====================================================================
#  Flush Zabbix's SNMPv3 engine cache if any router rebooted onto a new
#  package: RouterOS resets engineBoots on install and Zabbix would
#  otherwise drop every reply. See zabbix-snmp-reload.yml.
# =====================================================================
- name: Zabbix SNMPv3 cache
  ansible.builtin.import_playbook: zabbix-snmp-reload.yml
  vars:
    only_if_installed: true
